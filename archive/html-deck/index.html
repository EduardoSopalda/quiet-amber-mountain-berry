<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>From Brasília to the Plant Floor — Eduardo Sopalda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #090b08;
      --soil: #12150f;
      --surface: #1b1f18;
      --paper: #e7dfcf;
      --bone: #f3eee3;
      --ink: #0e110c;
      --muted: #9a917e;
      --brass: #8d7a52;
      --sap: #c6d24a;
      --moss: #6f8a32;
      --earth: #c45c32;
      --sky: #c9d6cf;
      --font-display: "Fraunces", "Times New Roman", serif;
      --font-ui: "IBM Plex Sans", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--void); color: var(--bone);
      font-family: var(--font-ui); overflow: hidden;
    }
    button { font-family: inherit; }
    .grain {
      pointer-events: none; position: fixed; inset: 0; z-index: 40; opacity: .18; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    #stage { position: relative; width: 100vw; height: 100vh; background: var(--void); }
    .scene {
      position: absolute; inset: 0; opacity: 0; visibility: hidden;
      transition: opacity .7s ease, visibility .7s;
      display: grid; place-items: stretch;
    }
    .scene.on { opacity: 1; visibility: visible; }
    .bg {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      transform: scale(1.06); filter: saturate(.92) contrast(1.05);
      transition: transform 8s ease-out;
    }
    .scene.on .bg { transform: scale(1); }
    .scrim {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(9,11,8,.82) 0%, rgba(9,11,8,.55) 42%, rgba(9,11,8,.18) 100%),
        linear-gradient(180deg, rgba(9,11,8,.2) 0%, rgba(9,11,8,.55) 100%);
    }
    .scrim.center {
      background:
        linear-gradient(180deg, rgba(9,11,8,.25) 0%, rgba(9,11,8,.72) 70%, rgba(9,11,8,.88) 100%);
    }
    .scrim.dark { background: rgba(9,11,8,.72); }
    .scrim.paper {
      background:
        radial-gradient(ellipse at 50% 30%, rgba(231,223,207,.08), transparent 50%),
        var(--void);
    }
    .safe {
      position: relative; z-index: 2;
      width: min(1280px, calc(100% - 8vw));
      margin: 0 auto;
      height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 8vh 0 11vh;
    }
    .safe.middle { justify-content: center; }
    .eyebrow {
      font-family: var(--font-mono);
      letter-spacing: .28em; text-transform: uppercase;
      font-size: clamp(.68rem, 1.1vw, .82rem); color: var(--sap); margin: 0 0 .8rem;
    }
    h1, h2 {
      font-family: var(--font-display); font-weight: 500; letter-spacing: -.03em;
      margin: 0; line-height: .92;
    }
    h1 { font-size: clamp(3.2rem, 8.4vw, 7.4rem); max-width: 16ch; }
    h2 { font-size: clamp(2.4rem, 5.6vw, 5.2rem); max-width: 18ch; }
    .sub {
      margin: 1.2rem 0 0; font-size: clamp(1.05rem, 1.8vw, 1.45rem);
      color: var(--paper); max-width: 38ch; line-height: 1.35; font-weight: 400;
    }
    .italic { font-family: var(--font-display); font-style: italic; font-weight: 400; }
    .quote {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(1.4rem, 2.6vw, 2.15rem); line-height: 1.25;
      max-width: 22ch; color: var(--bone); margin-top: 1.4rem;
    }
    .meta { margin-top: 1.6rem; color: var(--muted); font-size: .95rem; letter-spacing: .04em; }
    .meta strong { color: var(--paper); font-weight: 500; }

    .split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 4vw; align-items: end; height: 100%; }
    .pills { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.6rem; max-width: 46rem; }
    .pill {
      border: 1px solid rgba(198,210,74,.35); color: var(--paper);
      padding: .55rem .85rem; font-size: clamp(.8rem, 1.2vw, 1rem);
      background: rgba(18,21,15,.45); backdrop-filter: blur(6px);
    }
    .pill.ghost { border-color: rgba(243,238,227,.18); color: var(--muted); }

    .two-col {
      display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; width: 100%;
    }
    .col h3 {
      font-family: var(--font-mono); letter-spacing: .22em; text-transform: uppercase;
      font-size: .72rem; color: var(--sap); margin: 0 0 1rem;
    }
    .stack { display: flex; flex-direction: column; gap: .55rem; }
    .row-item {
      font-size: clamp(1.15rem, 2vw, 1.7rem); color: var(--bone);
      border-bottom: 1px solid rgba(243,238,227,.12); padding: .35rem 0;
      font-family: var(--font-display);
    }

    .carbon-num {
      font-family: var(--font-display); font-weight: 600;
      font-size: clamp(5rem, 16vw, 13rem); line-height: .8; letter-spacing: -.06em;
      color: var(--sap);
    }
    .carbon-num span { display: block; font-size: .18em; letter-spacing: .2em; color: var(--muted); font-family: var(--font-mono); font-weight: 400; margin-bottom: .4em; }

    .batch {
      display: flex; gap: 1.2vw; flex-wrap: wrap; margin-top: 1.4rem;
    }
    .batch b {
      font-family: var(--font-display); font-size: clamp(1.6rem, 3.4vw, 2.8rem); font-weight: 500;
      color: var(--bone);
    }
    .batch b.wrong { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--earth); }

    .docs-stat {
      display: flex; gap: 4vw; align-items: baseline; flex-wrap: wrap;
    }
    .stat big {
      font-family: var(--font-display); font-size: clamp(3.4rem, 8vw, 6.5rem); line-height: .85; display: block;
    }
    .stat em { font-style: normal; color: var(--muted); font-size: clamp(.85rem, 1.3vw, 1.05rem); letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-mono); }

    .principle {
      font-size: clamp(2.1rem, 5vw, 4.4rem); max-width: 16ch; line-height: .95;
    }
    .principle em { font-style: italic; color: var(--sap); }

    .road-words {
      display: flex; flex-direction: column; gap: .15rem; margin-top: 1.2rem;
    }
    .road-words span {
      font-family: var(--font-mono); letter-spacing: .28em; text-transform: uppercase;
      font-size: clamp(.7rem, 1.3vw, .95rem); color: var(--sap);
      opacity: .35;
    }
    .scene.on .road-words span { animation: rise .8s ease forwards; }
    .road-words span:nth-child(1) { animation-delay: .1s; }
    .road-words span:nth-child(2) { animation-delay: .2s; }
    .road-words span:nth-child(3) { animation-delay: .3s; }
    .road-words span:nth-child(4) { animation-delay: .4s; }
    .road-words span:nth-child(5) { animation-delay: .5s; }
    @keyframes rise { to { opacity: 1; } }

    #hud {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
      padding: 0 2.2vw 1.4vh; pointer-events: none; color: var(--muted);
      font-family: var(--font-mono); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
    }
    #hud b { color: var(--paper); font-weight: 500; }
    #progress {
      position: absolute; left: 0; bottom: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--moss), var(--sap));
      box-shadow: 0 0 16px rgba(198,210,74,.45);
      transition: width .45s ease;
    }
    .vine {
      position: absolute; left: 0; right: 0; bottom: 3px; height: 18px; overflow: hidden; opacity: .55;
    }
    .help { text-align: right; }
    #notes {
      position: fixed; right: 1.4vw; top: 1.4vw; width: min(340px, 30vw);
      background: rgba(18,21,15,.88); border: 1px solid rgba(198,210,74,.25);
      color: var(--paper); padding: 1rem 1.1rem; z-index: 60;
      font-size: .82rem; line-height: 1.4; display: none;
      backdrop-filter: blur(10px);
    }
    #notes.on { display: block; }
    #notes h4 { margin: 0 0 .4rem; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--sap); }
    #timer { font-variant-numeric: tabular-nums; }
    #boot {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(9,11,8,.72);
      display: grid; place-items: center; text-align: center; padding: 6vw;
    }
    #boot.hide { opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility .6s; }
    #boot .mark {
      width: min(280px, 50vw); height: auto; margin: 0 auto 2rem; opacity: .95;
    }
    #boot kbd {
      border: 1px solid var(--sap); color: var(--sap); padding: .15rem .45rem;
      font-family: var(--font-mono); font-size: .8em;
    }
    canvas#dust { position: fixed; inset: 0; z-index: 30; pointer-events: none; }

    /* Living Brasília: sketch → official plan → city */
    #world {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: #d8cbb3;
    }
    #world .ly {
      position: absolute; inset: 0;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 1.6s ease, transform 8s ease, filter 1.8s ease;
    }
    #world .paper {
      background:
        radial-gradient(ellipse at 50% 40%, #efe4cf 0%, #d7c7a8 55%, #c4b394 100%);
      opacity: 1;
    }
    #world .sketch {
      background-image: url("assets/plan-sketch.jpg");
      background-size: contain;
      background-position: 62% 46%;
      mix-blend-mode: multiply;
      filter: contrast(1.15) saturate(.6);
    }
    #world .blueprint {
      background-image: url("assets/plan-historic.jpg");
      background-size: contain;
      background-position: 58% 48%;
      mix-blend-mode: multiply;
      filter: contrast(1.05) sepia(.15);
    }
    #world .aerial {
      background-image: url("assets/aerial.jpg");
      background-size: cover;
      background-position: center 45%;
      mix-blend-mode: normal;
    }
    #world .street {
      background-image: url("assets/street.jpg");
      background-size: cover;
      background-position: center 70%;
    }
    #world .plant {
      background-image: url("assets/plant.jpg");
      background-size: cover;
      background-position: center;
    }
    #world .carbon {
      background-image: url("assets/carbon.jpg");
      background-size: cover;
    }
    #world .docs {
      background-image: url("assets/docs.jpg");
      background-size: cover;
    }
    #world .city {
      background-image: url("assets/city.jpg");
      background-size: cover;
      background-position: center 40%;
    }
    #world .organism {
      background-image: url("assets/drawing.jpg");
      background-size: contain;
      background-position: 70% 20%;
      mix-blend-mode: multiply;
    }
    #world svg.ink {
      width: 100%; height: 100%; opacity: 0;
      transform: none;
    }
    #world svg.ink path {
      fill: none;
      stroke: #1a1712;
      stroke-width: 1.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 2.8s ease, stroke 1s ease, opacity 1s ease;
    }
    #world svg.ink path.axis { stroke-width: 1.8; }
    #world svg.ink path.sap {
      stroke: #6f8a32;
      stroke-width: 1.4;
      opacity: 0;
    }
    #world .veil {
      background:
        linear-gradient(90deg, rgba(9,11,8,.78) 0%, rgba(9,11,8,.42) 46%, rgba(9,11,8,.18) 100%),
        linear-gradient(180deg, rgba(9,11,8,.12) 0%, rgba(9,11,8,.55) 100%);
      opacity: .55;
      mix-blend-mode: multiply;
    }

    /* age states — the drawing grows up */
    #world.age-paper .paper { opacity: 1; }

    #world.age-ink .paper { opacity: 1; }
    #world.age-ink .sketch { opacity: .95; transform: scale(1); }
    #world.age-ink svg.ink { opacity: .55; }
    #world.age-ink svg.ink path { stroke-dashoffset: 0; }

    #world.age-plan .paper { opacity: 1; }
    #world.age-plan .sketch { opacity: .25; transform: scale(1); }
    #world.age-plan .blueprint { opacity: .95; transform: scale(1); }
    #world.age-plan svg.ink { opacity: .35; }
    #world.age-plan svg.ink path { stroke-dashoffset: 0; }

    #world.age-city .paper { opacity: 0; }
    #world.age-city .sketch { opacity: 0; }
    #world.age-city .blueprint { opacity: .22; mix-blend-mode: overlay; transform: scale(1.08); }
    #world.age-city .aerial { opacity: 1; transform: scale(1); }
    #world.age-city svg.ink { opacity: .18; }
    #world.age-city svg.ink path { stroke: #c6d24a; stroke-dashoffset: 0; }
    #world.age-city .veil { opacity: .7; mix-blend-mode: normal; background:
      linear-gradient(90deg, rgba(9,11,8,.72) 0%, rgba(9,11,8,.4) 50%, rgba(9,11,8,.2) 100%); }

    #world.age-ground .paper { opacity: 0; }
    #world.age-ground .aerial { opacity: .15; }
    #world.age-ground .street { opacity: 1; transform: scale(1); }
    #world.age-ground .veil { opacity: .75; mix-blend-mode: normal; background:
      linear-gradient(180deg, rgba(9,11,8,.2), rgba(9,11,8,.72) 80%); }

    #world.age-plant .plant { opacity: 1; transform: scale(1); }
    #world.age-plant .blueprint { opacity: .12; mix-blend-mode: overlay; }
    #world.age-plant svg.ink { opacity: .12; }
    #world.age-plant svg.ink path.sap { opacity: .8; stroke-dashoffset: 0; }
    #world.age-plant .veil { opacity: .7; mix-blend-mode: normal; background:
      linear-gradient(90deg, rgba(9,11,8,.78) 0%, rgba(9,11,8,.35) 60%, rgba(9,11,8,.2) 100%); }

    #world.age-carbon .carbon { opacity: 1; transform: scale(1); }
    #world.age-carbon .blueprint { opacity: .1; mix-blend-mode: screen; }
    #world.age-carbon .veil { opacity: .55; mix-blend-mode: normal; }

    #world.age-docs .docs { opacity: 1; transform: scale(1); }
    #world.age-docs .veil { opacity: .6; mix-blend-mode: normal; }

    #world.age-road .city { opacity: 1; transform: scale(1); }
    #world.age-road svg.ink { opacity: .15; }
    #world.age-road svg.ink path { stroke: #c6d24a; stroke-dashoffset: 0; }
    #world.age-road .veil { opacity: .65; mix-blend-mode: normal; }

    #world.age-void .paper { opacity: 0; }
    #world.age-void .blueprint { opacity: .08; mix-blend-mode: soft-light; }
    #world.age-void svg.ink { opacity: .22; }
    #world.age-void svg.ink path { stroke: #c6d24a; stroke-dashoffset: 0; }
    #world.age-void .veil { opacity: .82; mix-blend-mode: normal; background: rgba(9,11,8,.82); }

    #world.age-return .paper { opacity: 0; }
    #world.age-return .aerial { opacity: 1; transform: scale(1); }
    #world.age-return .blueprint { opacity: .35; mix-blend-mode: overlay; }
    #world.age-return svg.ink { opacity: .4; }
    #world.age-return svg.ink path { stroke: #e7dfcf; stroke-dashoffset: 0; }
    #world.age-return .veil { opacity: .68; mix-blend-mode: normal; }

    #world.age-close .paper { opacity: 1; }
    #world.age-close .organism { opacity: .9; transform: scale(1); }
    #world.age-close .sketch { opacity: .2; }
    #world.age-close svg.ink { opacity: .25; }
    #world.age-close svg.ink path { stroke-dashoffset: 0; }
    #world.age-close .veil { opacity: .55; mix-blend-mode: multiply; }

    #stage { z-index: 2; background: transparent; }
    .scene .bg { display: none; } /* world layer owns the image now */
    .scrim.paper { background: transparent; }
    .scrim { background: transparent; }
    .scrim.center { background: transparent; }

    .figure {
      position: absolute; right: 6vw; top: 10vh; height: 72vh; width: auto; max-width: 42vw;
      object-fit: contain; filter: drop-shadow(0 20px 40px rgba(0,0,0,.45));
      opacity: 0; transform: translateY(18px);
    }
    .scene.on .figure { opacity: 1; transform: none; transition: opacity 1.1s ease, transform 1.1s ease; }

    .wordbox {
      margin-top: 1.6rem; display: flex; gap: .6rem; pointer-events: auto;
    }
    .wordbox input {
      background: transparent; border: none; border-bottom: 1px solid var(--sap);
      color: var(--bone); font-family: var(--font-display); font-size: 1.6rem;
      padding: .3rem 0; min-width: 16ch; outline: none;
    }
    .wordbox button {
      background: var(--sap); color: var(--ink); border: 0; padding: .6rem 1rem;
      letter-spacing: .14em; text-transform: uppercase; font-size: .72rem; cursor: pointer;
    }
    #cloud { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: .5rem .8rem; min-height: 2rem; }
    #cloud span {
      font-family: var(--font-display); font-style: italic; color: var(--sap);
      font-size: clamp(1.1rem, 2vw, 1.8rem);
    }

    @media (max-width: 900px) {
      .split, .two-col { grid-template-columns: 1fr; }
      .figure { position: relative; right: auto; top: auto; height: 36vh; max-width: 80vw; margin-bottom: 1rem; }
      .safe { padding: 6vh 0 12vh; }
      h1 { font-size: clamp(2.4rem, 12vw, 4rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
      .bg { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <canvas id="dust"></canvas>

  <div id="world" class="age-paper">
    <div class="ly paper"></div>
    <div class="ly sketch"></div>
    <div class="ly blueprint"></div>
    <div class="ly organism"></div>
    <div class="ly aerial"></div>
    <div class="ly street"></div>
    <div class="ly plant"></div>
    <div class="ly carbon"></div>
    <div class="ly docs"></div>
    <div class="ly city"></div>
    <svg class="ly ink" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <!-- Lúcio Costa Pilot Plan — drawn, not decorated -->
      <path class="axis" pathLength="1" d="M600 96 L600 690" />
      <path pathLength="1" d="M600 118 L572 162 L628 162 Z" />
      <path pathLength="1" d="M585 200 H615 V455 H585 Z" />
      <path pathLength="1" d="M560 250 H640 V310 H560 Z" />
      <path pathLength="1" d="M600 455 L575 520 L625 520 Z" />
      <path pathLength="1" d="M600 520 V640" />
      <!-- wings / residential axes -->
      <path pathLength="1" d="M600 310
        C 470 300, 330 270, 210 250
        C 170 242, 145 268, 168 300
        C 250 430, 390 500, 560 520" />
      <path pathLength="1" d="M600 310
        C 730 300, 870 270, 990 250
        C 1030 242, 1055 268, 1032 300
        C 950 430, 810 500, 640 520" />
      <!-- superblock ticks on wings -->
      <path pathLength="1" d="M250 270 L268 318 M320 278 L336 328 M390 292 L404 344 M460 305 L472 352" />
      <path pathLength="1" d="M950 270 L932 318 M880 278 L864 328 M810 292 L796 344 M740 305 L728 352" />
      <!-- lake Paranoá -->
      <path pathLength="1" d="M160 430
        C 80 520, 90 640, 250 700
        C 420 760, 780 755, 980 690
        C 1120 640, 1140 520, 1040 430" />
      <!-- sketch cross, first mark Costa made -->
      <path pathLength="1" d="M560 70 H640 M600 40 V110" />
      <!-- sap / data vine that grows later -->
      <path class="sap" pathLength="1" d="M600 690 C 620 600, 580 520, 600 455 C 640 380, 520 300, 600 200" />
    </svg>
    <div class="ly veil"></div>
  </div>

  <div id="boot">
    <div>
      <p class="eyebrow">AUTOMA Chem 2026 · Berlin · Opening panel</p>
      <h2 style="font-size:clamp(2rem,6vw,3.6rem);max-width:14ch;margin:0 auto;">From Brasília to the Plant Floor</h2>
      <p class="sub" style="margin-inline:auto;color:var(--muted)">A living talk. Not a deck.</p>
      <p class="meta" style="max-width:42ch;margin-inline:auto;line-height:1.6">
        Press <kbd>F</kbd> for fullscreen · <kbd>Space</kbd> or click to advance · <kbd>←</kbd> back · <kbd>N</kbd> notes · <kbd>T</kbd> timer
      </p>
      <p class="meta">Eduardo Sopalda · dsm-firmenich</p>
    </div>
  </div>

  <div id="stage"></div>

  <aside id="notes"><h4>Speaker</h4><p id="noteText"></p></aside>

  <div id="hud">
    <div id="progress"></div>
    <div><span id="timer">00:00</span></div>
    <div style="text-align:center"><b id="label"></b></div>
    <div class="help">Space · ← → · F · N</div>
  </div>

  <script>
    const SCENES = [
      {
        id: "title",
        act: "0",
        age: "plant",
        label: "Hold",
        cue: "0:00  Hold. Do not read the title. Walk on. First spoken line is Act 01: I am an architect. Not as a metaphor.",
        html: `
          <div class="safe">
            <p class="eyebrow">AUTOMA Chem 2026 · Berlin · 26 October · Opening panel</p>
            <h1>From Brasília<br>to the Plant Floor</h1>

    const world = document.getElementById("world");
    const stage = document.getElementById("stage");
    SCENES.forEach((s, i) => {
      const el = document.createElement("section");
      el.className = "scene";
      el.dataset.i = i;
      el.innerHTML = s.html;
      stage.appendChild(el);
    });

    let i = 0, started = false, t0 = 0, ticking = false;
    const scenes = [...document.querySelectorAll(".scene")];
    const note = document.getElementById("noteText");
    const notes = document.getElementById("notes");
    const label = document.getElementById("label");
    const bar = document.getElementById("progress");
    const boot = document.getElementById("boot");
    const timerEl = document.getElementById("timer");

    function show(n) {
      i = Math.max(0, Math.min(SCENES.length - 1, n));
      scenes.forEach((el, k) => el.classList.toggle("on", k === i));
      note.textContent = SCENES[i].cue;
      const act = SCENES[i].act && SCENES[i].act !== "0" ? `Act ${SCENES[i].act}  ·  ` : "";
      label.textContent = `${act}${SCENES[i].label}`;
      bar.style.width = ((i) / (SCENES.length - 1) * 100) + "%";
      location.hash = SCENES[i].id;
      const age = SCENES[i].age || "void";
      world.className = "age-" + age;
    }

    function start() {
      if (!started) {
        started = true;
        t0 = Date.now();
        ticking = true;
        boot.classList.add("hide");
      }
      show(i);
    }

    function next() { if (!started) { start(); return; } show(i + 1); }
    function prev() { if (!started) { start(); return; } show(i - 1); }

    document.addEventListener("click", (e) => {
      if (e.target.closest(".wordbox")) return;
      next();
    });
    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input")) return;
      if (e.code === "Space" || e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") { e.preventDefault(); prev(); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(SCENES.length - 1);
      if (e.key === "n" || e.key === "N") notes.classList.toggle("on");
      if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
      }
      if (e.key === "t" || e.key === "T") ticking = !ticking;
      if (e.key === "Escape" && started) { /* keep going */ }
    });

    function replayInk() {
      world.querySelectorAll("svg.ink path").forEach((p) => {
        p.style.transition = "none";
        p.style.strokeDashoffset = "1";
        void p.getBoundingClientRect();
        p.style.transition = "";
        p.style.strokeDashoffset = "0";
      });
    }
    setTimeout(() => {
      if (!started) {
        world.className = "age-plant";
      }
    }, 500);

    const hash = location.hash.replace("#","");
    const fromHash = SCENES.findIndex(s => s.id === hash);
    if (fromHash >= 0) i = fromHash;

    setInterval(() => {
      if (!started || !ticking) return;
      const s = Math.floor((Date.now() - t0) / 1000);
      timerEl.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
    }, 250);

    const cloud = document.getElementById("cloud");
    document.getElementById("dropWord")?.addEventListener("click", drop);
    document.getElementById("theWord")?.addEventListener("keydown", (e) => { if (e.key === "Enter") drop(); });
    function drop() {
      const input = document.getElementById("theWord");
      const v = (input.value || "").trim();
      if (!v) return;
      const span = document.createElement("span");
      span.textContent = v;
      cloud.appendChild(span);
      input.value = "";
    }

    const c = document.getElementById("dust");
    const ctx = c.getContext("2d");
    const bits = Array.from({length: 48}, () => ({
      x: Math.random(), y: Math.random(), r: Math.random()*1.6+.3,
      s: Math.random()*0.00035 + 0.00008, a: Math.random()*0.35 + 0.08
    }));
    function size() { c.width = innerWidth; c.height = innerHeight; }
    size(); addEventListener("resize", size);
    (function tick(){
      ctx.clearRect(0,0,c.width,c.height);
      bits.forEach(p => {
        p.y -= p.s; if (p.y < 0) p.y = 1;
        ctx.fillStyle = `rgba(198,210,74,${p.a})`;
        ctx.beginPath(); ctx.arc(p.x*c.width, p.y*c.height, p.r, 0, Math.PI*2); ctx.fill();
      });
      requestAnimationFrame(tick);
    })();
  </script>
